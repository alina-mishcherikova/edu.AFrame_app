<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>AR Mini Exhibit (A-Frame)</title>

    <link rel="stylesheet" href="./css/common.css" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Our components -->
    <script src="./js/aframe-components/hit-test.js"></script>
    <script src="./js/aframe-components/controller-ui.js"></script>
    <script src="./js/aframe-components/app.js" defer></script>
  </head>

  <body>
    <div
      id="arOverlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
      "
    >
      <div
        id="debugPanel"
        style="
          position: absolute;
          top: 10px;
          left: 10px;
          z-index: 1001;
          display: none;
          max-width: 90vw;
          max-height: 40vh;
          overflow-y: auto;
          padding: 10px;
          background: rgba(0, 0, 0, 0.85);
          color: #0f0;
          font-family: monospace;
          font-size: 12px;
          border-radius: 8px;
          pointer-events: none;
          line-height: 1.4;
        "
      >
        <div id="debugLog"></div>
      </div>

      <div
        id="arHint"
        style="
          position: absolute;
          top: 30px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 999;
          display: none;
          padding: 12px 24px;
          background: rgba(0, 0, 0, 0.7);
          color: white;
          border-radius: 20px;
          font-size: 16px;
          text-align: center;
          pointer-events: none;
        "
      >
        👆 Tap to place exhibits
      </div>

    <div id="startScreen">
      <div id="startCard">
        <h1>🎨 XR Mini Exhibit</h1>
        <p>
          Explore artifacts in augmented reality. Press START to begin your
          journey.
        </p>
        <button id="startBtn">START AR</button>
        <div id="startError" class="hidden"></div>
      </div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true; antialias: true"
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors, dom-overlay; overlayElement: #arOverlay"
      ar-hit-test="maxPlaces: 10"
    >
      <!-- Info Text Panel -->
      <a-entity position="0 1.8 -1" geometry="primitive: plane; width: 3; height: 0.6" material="color: #1a1a2e; opacity: 0.85; shader: flat">
        <a-entity 
          position="0 0.15 0.01"
          text="value: XR MINI EXHIBIT; align: center; anchor: center; width: 2; color: #1e90ff; fontSize: 40">
        </a-entity>
        
        <a-entity 
          position="0 -0.05 0.01"
          text="value: Augmented Reality Experience; align: center; anchor: center; width: 2.5; color: #ffffff; fontSize: 20">
        </a-entity>
        
        <a-entity 
          position="0 -0.2 0.01"
          text="value: Rotate to explore • Press Grip to switch modes; align: center; anchor: center; width: 2.8; color: #90ee90; fontSize: 16">
        </a-entity>
      </a-entity>
  
      <a-assets timeout="20000">
        <a-asset-item
          id="modelExhibit"
          src="./media/gltf/sculpture/imposter.glb"
        ></a-asset-item>
        <a-asset-item
          id="artStatue"
          src="./media/gltf/sculpture/art_statue.glb"
        ></a-asset-item>
        <a-asset-item
          id="chickenLessons"
          src="./media/gltf/sculpture/chicken_lessons.glb"
        ></a-asset-item>
        <a-asset-item
          id="imposter"
          src="./media/gltf/sculpture/imposter.glb"
        ></a-asset-item>
        <a-asset-item
          id="pyramid"
          src="./media/gltf/sculpture/Pyramid.glb"
        ></a-asset-item>
        <a-asset-item
          id="table"
          src="./media/gltf/elements/Table.glb"
        ></a-asset-item>
        <a-asset-item
          id="pictureFrame"
          src="./media/gltf/elements/picture_frame.glb"
        ></a-asset-item>
        <a-asset-item
          id="modelReticle"
          src="./media/gltf/reticle/reticle.gltf"
        ></a-asset-item>
      </a-assets>

      <a-entity camera position="0 1.6 0"></a-entity>

      <a-entity
        id="reticle"
        visible="false"
        gltf-model="#modelReticle"
        ar-reticle
      ></a-entity>

      <a-entity id="exhibitRoot" visible="false"></a-entity>
      
      <!-- Right controller -->
      <a-entity
        id="rightHand"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .ui-btn"
        cursor="rayOrigin: entity; fuse: false"
        controller-ui
      ></a-entity>

      <!-- Left controller -->
      <a-entity
        id="leftHand"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .ui-btn"
        cursor="rayOrigin: entity; fuse: false"
        controller-ui
      ></a-entity>
    </a-scene>
  </body>
</html>
