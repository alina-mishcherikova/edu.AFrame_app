<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>AR Mini Exhibit (A-Frame)</title>

    <link rel="stylesheet" href="./css/common.css" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Our components -->
    <script src="./js/aframe-components/hit-test.js"></script>
    <script src="./js/aframe-components/controller-ui.js"></script>
    <script src="./js/aframe-components/app.js" defer></script>
  </head>

  <body>
    <div
      id="arOverlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
      "
    >
      <div
        id="debugPanel"
        style="
          position: absolute;
          top: 10px;
          left: 10px;
          z-index: 1001;
          display: none;
          max-width: 90vw;
          max-height: 40vh;
          overflow-y: auto;
          padding: 10px;
          background: rgba(0, 0, 0, 0.85);
          color: #0f0;
          font-family: monospace;
          font-size: 12px;
          border-radius: 8px;
          pointer-events: none;
          line-height: 1.4;
        "
      >
        <div id="debugLog"></div>
      </div>

      <div
        id="arHint"
        style="
          position: absolute;
          top: 30px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 999;
          display: none;
          padding: 12px 24px;
          background: rgba(0, 0, 0, 0.7);
          color: white;
          border-radius: 20px;
          font-size: 16px;
          text-align: center;
          pointer-events: none;
        "
      >
        👆 Tap screen to place exhibits
      </div>

      <div
        id="arUI"
        style="
          position: absolute;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 1000;
          display: none;
          flex-direction: row;
          gap: 15px;
          pointer-events: auto;
        "
      >
        <button
          id="resetBtn"
          style="
            padding: 15px 30px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
          "
        >
          🔄 Reset
        </button>
        <button
          id="infoBtn"
          style="
            padding: 15px 30px;
            background: rgba(13, 110, 253, 0.9);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
          "
        >
          ℹ️ Info
        </button>
      </div>
    </div>

    <div id="startScreen" style="pointer-events: auto; z-index: 15000">
      <div id="startCard">
        <h1>XR Mini Exhibit</h1>
        <p>Press START to enter AR</p>
        <button id="startBtn">START AR</button>
        <div id="startError" class="hidden"></div>
      </div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true; antialias: true"
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors, dom-overlay; overlayElement: #arOverlay"
      ar-hit-test="maxPlaces: 10"
    >
      <a-assets timeout="20000">
        <a-asset-item
          id="modelExhibit"
          src="./media/gltf/sculpture/imposter.glb"
        ></a-asset-item>
        <a-asset-item
          id="modelReticle"
          src="./media/gltf/reticle/reticle.gltf"
        ></a-asset-item>
      </a-assets>

      <a-entity camera position="0 1.6 0"></a-entity>

      <a-entity
        id="reticle"
        visible="false"
        gltf-model="#modelReticle"
        ar-reticle
      ></a-entity>

      <a-entity id="exhibitRoot" visible="false"></a-entity>
    </a-scene>
  </body>
</html>
